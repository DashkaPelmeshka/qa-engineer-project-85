  steps:
    - Ввести имя "DashkaPelmeshka"
    - Ввести электронную почту "da-da-da-da@yandex.ru"
    - Ввести пароль "qwert1234"
    - Подтвердить пароль
    - Нажать кнопку "Зарегистрироваться"
  expected-result: |
    Под полем имя пользователя появляется сообщение об ошибке "Nickname is already taken"


    Профиль обезличен, все сеансы завершены, вход в аккаунт навсегда отключён, персональные данные недоступны. Войти с прежними данными невозможно

- summary: |
    Успешное задание уровня сложности задачи при создании битвы
  requirement: |
    При создании битвы пользователь должен иметь возможность задать уровень сложности задачи - Начальный, Лёгкий, Средний, Сложный

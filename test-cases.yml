---
- summary: |
    Успешная регистрация на сайте
  requirement: |
    Пользователь должен иметь возможность зарегистрироваться на сайте с помощью электронной почты, уникальной в пределах сайта, пароля (не менее 8 символов) и задаваемого пользователем ника (от 3 до 16 латинских букв, цифр и знаков "-" и "_"), уникального в пределах сайта
  prerequisites: |
    Открыта страница регистрации, вход в аккаунт не осуществлен
  test-data: |
    Имя "zaya-zaya" (или другое незанятое имя при необходимости), электронная почта "zaya-zaya-zaya@yandex.ru" (или другой незанятый адрес при необходимости), пароль "qwert1234"
  steps:
    - Ввести имя "zaya-zaya"
    - Ввести электронную почту "zaya-zaya-zaya@yandex.ru"
    - Ввести пароль "qwert1234"
    - Подтвердить пароль
    - Нажать кнопку "Зарегистрироваться"
  expected-result: |
    Открывается страница "Войти" с сообщением "Мы отправили письмо для подтверждения. Подтвердите адрес перед входом."

- summary: |
    Наличие предупреждения об ошибке в нике - ник уже используется
  requirement: |
    При регистрации на сайте сайт должен подсвечивать пользователю ошибку, если пользователь ввёл некорректный ник - с недопустимыми символами, слишком длинный или короткий, неуникальный в пределах сайта
  prerequisites: |
    Открыта страница регистрации, вход в аккаунт не осуществлен
  test-data: |
    Имя "DashkaPelmeshka", электронная почта "da-da-da-da@yandex.ru" (или другой незанятый адрес при необходимости), пароль "qwert1234"
  steps:
    - Ввести имя "DashkaPelmeshka"
    - Ввести электронную почту "da-da-da-da@yandex.ru"
    - Ввести пароль "qwert1234"
    - Подтвердить пароль
    - Нажать кнопку "Зарегистрироваться"
  expected-result: |
    Под полем имя пользователя появляется сообщение об ошибке "Nickname is already taken"


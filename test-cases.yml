- summary: |
    Успешное восстановление забытого пароля через подтверждение по электронной почте
  requirement: |
    После регистрации на сайте пользователь должен иметь возможность восстановить забытый пароль через подтверждение по электронной почте, указанной при регистрации
  prerequisites: |
    Открыта страница входа, вход в аккаунт не осуществлен, существует аккаунт с подтверждённой почтой
  test-data: |
    Адре электронной почты любого активного аккаунта, созданного на сайте
  steps:
    - На странице входа нажать ссылку восстановления пароля
    - Ввести адрес электронной почты, указанный при регистрации
    - Нажать "Сбросить пароль"
    - Открыть почтовый ящик и перейти по ссылке из письма восстановления
    - Задать новый пароль
    - Войти на сайте с новым паролем
  expected-result: |
    Пароль успешно восстановлен (задан новый) через подтверждение по электронной почте, старый пароль не работает


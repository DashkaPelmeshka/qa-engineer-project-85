- summary: |
    Наличие предупреждения об ошибке в адресе электронной почты при регистрации - адрес некорректен
  requirement: |
    При регистрации на сайте сайт должен подсвечивать пользователю ошибку, если пользователь ввёл некорректный адрес электронной почты
  prerequisites: |
    Открыта страница регистрации, вход в аккаунт не осуществлен
  test-data: |
    Имя - любое допустимое и уникальное в пределах сайта, адрес электронной почты - любой некорректный (без @, с несколькими @@, без домена-окончания, содержащий не-латинские символы), пароль - любой корректный
  steps:
    - Заполнить поля имени и пароля корректными данными
    - Ввести в поле электронной почты некорректный адрес
    - Нажать кнопку регистрации
  expected-result: |
    Регистрация не выполняется, у поля электронной почты подсвечивается ошибка с сообщением о некорректном адресе

- summary: |
    Успешные скрытие и показ символов вводимого пароля при регистрации
  requirement: |
    При регистрации на сайте пользователь должен иметь возможность скрыть или показать символы вводимого пароля
  prerequisites: | 
    Открыта страница регистрации, вход в аккаунт не осуществлен
  test-data: |
    Любой пароль
  steps:
    - Ввести произвольный пароль и убедиться, что символы маскируются
    - Нажать на иконку показа пароля (глаз)
    - Нажать на иконку повторно
  expected-result: |
    По умолчанию символы пароля скрыты (маскированы); после первого нажатия символы отображаются открыто, после повторного — снова скрываются

- summary: |
    Успешная отправка письма с требованием подтвердить электронную почту при регистрации
  requirement: |
    При регистрации на сайте пользователя сайт должен отправить пользователю на почту сообщение с требованием подтвердить адрес электронной почты
  prerequisites: |
    Открыта страница регистрации, вход в аккаунт не осуществлен, доступен почтовый ящик тестового пользователя
  test-data: |
    Имя, пароль и адрес электронной почты - любые корректные
  steps:
    - Ввести данные пользователя и нажать кнопку "Зарегистрироваться"
    - На сайте откроется окно "Войти" с сообщением о необходимости подтвердить адрес электронной почты с помощью письма, отправленного на этот адрес
    - Открыть почтовый ящик указанной при регистрации электронной почты
  expected-result: |
    На электронную почту пользователя пришло письмо от сайта с требованием подтвердить адрес электронной почты

- summary: |
    Успешное подтверждение адреса электронной почты по ссылке из письма
  requirement: |
    При регистрации на сайте пользователь должен подтвердить адрес электронной почты, нажав на ссылку или кнопку подтверждения в письме, пришедшем на его электронный адрес
  prerequisites: |
    Пользователь зарегистрирован, на его почту пришло письмо с подтверждением
  test-data: |
    Письмо подтверждения на почте, указанной пользователем при регистрации
  steps:
    - Открыть письмо с подтверждением электронной почты
    - Нажать на ссылку или кнопку подтверждения в письме
  expected-result: |
    Электронная почта подтверждается, аккаунт становится активным, пользователь видит сообщение об успешном подтверждении

- summary: |
    Успешная проверка уникальности имени каждого пользователя на сайте
  requirement: |
    Имя каждого пользователя на сайте должен быть уникальным

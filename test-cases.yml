---
- summary: |
    При первом открытии сайта сайт отображается на английском языке
  requirement: |
    При первом открытии сайта игры интерфейс должен быть на английском языке
  prerequisites: |
    Браузер с полностью очищенными cookies и кэшем, открыта главная страница сайта
  test-data: |
    Очищенные cookies и кэш браузера (имитация первого посещения сайта)
  steps:
    - Очистить cookies и кэш браузера
    - Открыть главную страницу сайта
    - Просмотреть все элементы интерфейса - меню, кнопки, подсказки, сообщения
  expected-result: |
    Весь интерфейс сайта при первом открытии отображается на английском языке

- summary: |
    В списке доступны все заявленные языки программирования
  requirement: |
    На сайте пользователю должны быть доступны для выбора следующие языки программирования - C#, C++, Closure, D, Dart, Elixir, Go, Java, JavaScript, Kotlin, PHP, Python, Ruby, Rust, Swift, TypeScript, Zig
  prerequisites: |
    Открыта страница создания битвы
  test-data: |
    Заданный список из 17 языков - C#, C++, Closure, D, Dart, Elixir, Go, Java, JavaScript, Kotlin, PHP, Python, Ruby, Rust, Swift, TypeScript, Zig
  steps:
    - Открыть выпадающий список выбора языка программирования
    - Сравнить содержимое списка с заданным списком языков
  expected-result: |
    В списке выбора присутствуют все 17 языков программирования - C#, C++, Closure, D, Dart, Elixir, Go, Java, JavaScript, Kotlin, PHP, Python, Ruby, Rust, Swift, TypeScript, Zig

- summary: |
    Успешное изменение языка программирования в битве
  requirement: |
    На странице битвы пользователь должен иметь возможность выбрать и в любой момент изменить язык программирования, на котором пользователь пишет решение задачи
  prerequisites: |
    Открыта страница битвы
  test-data: |
    Первоначальный язык - Python, новый язык - JavaScript
  steps:
    - Начать битву, выбрав язык Python
    - Написать в редакторе часть решения на Python
    - Открыть список выбора языка программирования
    - Выбрать язык JavaScript и продолжить написание решения
  expected-result: |
    Язык успешно изменён, подсветка синтаксиса и поведение редактора соответствуют новому языку (но код на предыдущем языке не сохранился в полном объёме, код на новом языке содержит только шаблон решения)

- summary: |
    Успешная игра незарегистрированного пользователя с ботом по случайной задаче
  requirement: |
    Незарегистрированный пользователь должен иметь возможность сыграть битву с соперником-ботом по случайной задаче, перед началом битвы выбрав язык программирования
  prerequisites: |
    Открыта главная страница сайта, пользователь не зарегистрирован и не авторизован
  test-data: |
    Язык программирования - Python
  steps:
    - Не выполняя регистрацию и вход, нажать на главной странице кнопку "Сыграть первую дуэль"
    - На экране выбора языка программирования выбрать Python
    - Подтвердить начало битвы
  expected-result: |
    Битва с соперником-ботом по случайной задаче начинается без требования регистрации, битва проходит корректо по всем правилам

- summary: |
    Успешная регистрация на сайте
  requirement: |
    Пользователь должен иметь возможность зарегистрироваться на сайте с помощью электронной почты, уникальной в пределах сайта, пароля (не менее 8 символов) и задаваемого пользователем имени (от 3 до 16 латинских букв, цифр и знаков "-" и "_"), уникального в пределах сайта
  prerequisites: |
    Открыта страница регистрации, вход в аккаунт не осуществлен
  test-data: |
    Имя "zaya-zaya" (или другое незанятое имя при необходимости), электронная почта "zaya-zaya-zaya@yandex.ru" (или другой незанятый адрес при необходимости), пароль "qwert1234"
  steps:
    - Ввести имя "zaya-zaya"
    - Ввести электронную почту "zaya-zaya-zaya@yandex.ru"
    - Ввести пароль "qwert1234"
    - Подтвердить пароль
    - Нажать кнопку "Зарегистрироваться"
  expected-result: |
    Открывается страница "Войти" с сообщением "Мы отправили письмо для подтверждения. Подтвердите адрес перед входом."

- summary: |
    Предупреждение об ошибке в имени при регистрации - имя уже используется
  requirement: |
    При регистрации на сайте сайт должен подсвечивать пользователю ошибку, если пользователь ввёл некорректое имя - с недопустимыми символами, слишком длинный или короткий (должен содержать от 3 до 16 латинских букв, цифр и знаков "-" и "_"), неуникальный в пределах сайта
  prerequisites: |
    Открыта страница регистрации, вход в аккаунт не осуществлен
  test-data: |
    Имя "DashkaPelmeshka" (или любое другое уже занятое имя), электронная почта "da-da-da-da@yandex.ru" (или другой незанятый адрес при необходимости), пароль "qwert1234"
  steps:
    - Ввести имя "DashkaPelmeshka"
    - Ввести электронную почту "da-da-da-da@yandex.ru"
    - Ввести пароль "qwert1234"
    - Подтвердить пароль
    - Нажать кнопку "Зарегистрироваться"
  expected-result: |
    Под полем имя пользователя появляется сообщение об ошибке "Nickname is already taken"


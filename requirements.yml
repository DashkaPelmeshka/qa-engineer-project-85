  - Пользователь должен иметь возможность выйти с выбранных активных устройств
  - Пользователь должен иметь возможность привязать аккаунт Discord, если пользователь вошёл под аккаунтом сайта или GitHub
  - Пользователь должен иметь возможность привязать аккаунт GitHub, если пользователь вошёл под аккаунтом сайта или Discord
  - Пользователь должен иметь возможность привязать аккаунт GitHub и(или) Discord, если пользователь вошёл под аккаунтом сайта
  - На главной странице сайта должен быть чат, где пользователи могут обмениваться сообщениями и видеть, какие пользователи сейчас в сети
non-functional:
  - Сайт нужно разработать с учетом удобства использования и оптимизировать для скорости работы
  - Сайт должен быть безопасным и защищать данные пользователя
  - Сайт должен иметь мобильную версию
  - Сайт нужно протестировать на совместимость с последними версиями браузеров (Google Chrome, Яндекс.Браузер, Firefox, Safari)
  - Важно, чтобы сайт мог обрабатывать большое количество трафика - до 1000 пользователей одновременно
  - Сайт должен быть доступен на различных устройствах
  - Сайт должен быть написан с использованием Clojure (для создания и проведения тестов), Elixir (для бекэнда), JS/React/Redux (для фронтэнда)
  - При разработке и деплое сайта должны быть использованы Docker и Ansible
  - Сайт должен иметь локализацию (перевод) на английский, русский, испанский и китайский языки
  - Сайт должен быть доступен для пользователей без использования VPN (прямой доступ из сети Интернет)
  - При разрыве соединения сайт должен переподключаться автоматически
  - Задержка отображения новый данных от соперника и от сайта должна составлять не более 1 секунды
  - При регистрации на сайте пользователя сайт должен отправить пользователю на почту сообщение с требованием подтвердить адрес электронной почты в течение 5 минут
implicit:
  - Интерфейс сайта должен быть достаточно эстетичным
  - Вёрстка должна быть адаптивной - ровной и аккуратной при любых размерах окна
  - Все ресурсы сайта должны загружаться корректно
  - Все запросы сайта должны отправляться корректно
  - В консоли Devtools не должно быть ошибок выполнения скриптов
  - Шрифт должен быть читаемым для большинства пользователей - достаточно большим и контрастным
  - Сайт должен реагировать на действия пользователя достаточно быстро - не дольше 1 секунды
  - Информация на сайте не должна нарушать законы об авторском праве
  - Сайт должен функционировать согласно законам страны, в которой он используется
  - Задачи, представленные на сайте, должны быть корректными, полными, решаемыми и описанными достаточно исчерпывающе и без ошибок на всех поддерживаемых сервисом языках
  - Так как этот проект к открытым кодом, каждый пользователь с аккаунтом GitHub должен иметь возможность отправлять запросы правок к сервису и к задачам
  - Каждый пользователь с аккаунтов GitHub должен иметь возможность отправлять issue и баг-репорты
  - На странице битвы пользователь не может изменять код соперника
  - На странице битвы зрители не могут изменять код игроков
  - Пользователи не могут вручную вносить изменения в рейтинговые таблицы
  - На странице битвы пользователи не могут поменять задачу
  - Сайт предупреждает о сборе и хранении cookies
  - Сайт собирает и хранит cookies - благодаря этому сайт открывается с введёнными ранее личными данными при перезагрузке страницы и в течение как минимум 24 часов после входа

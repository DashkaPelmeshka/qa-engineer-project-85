  - В личном кабинете пользователь должен иметь возможность видеть статистику его сражений по битвам и по турнирам
  - В личном кабинете пользователь должен иметь возможность создать API-токены для для ботов, CLI и устройств
  - В личном кабинете пользователь должен иметь возможность просматривать созданные ранее API-токены
  - В личном кабинете пользователь должен иметь возможность удалять созданные  ранее API-токены
  - На странице битвы пользователь должен иметь возможность видеть свой редактор кода и редактор кода противника в реальном времени
  - На странице битвы пользователь должен иметь возможность видеть результат прохождения тестов - своих и соперника
  - На странице битвы пользователь должен иметь возможность показывать или скрывать отображение задачи
  - На странице битвы пользователь должен иметь возможность предложить правку к задаче, по которой идёт битва
  - На странице битвы должен быть чат, где игроки-соперники могут общаться один на один

non-functional:
  - Сайт нужно разработать с учетом удобства использования и оптимизировать для скорости работы
  - Сайт должен быть безопасным и защищать данные пользователя
  - Сайт должен иметь мобильную версию
  - Сайт нужно протестировать на совместимость с последними версиями браузеров
  - Важно, чтобы сайт мог обрабатывать большое количество трафика - до 1000 пользователей одновременно
  - Сайт должен быть доступен на различных устройствах
  - Сайт должен иметь локализацию (перевод) на английский, русский, испанский и китайский языки
  - Сайт должен быть доступен для пользователей без использования VPN (прямой доступ из сети Интернет)
  - При разрыве соединения сайт должен переподключаться автоматически
  - Задержка отображения новый данных от соперника и от сайта должна составлять не более 1 секунды
  - При регистрации на сайте пользователя сайт должен отправить пользователю на почту сообщение с требованием подтвердить адрес электронной почты в течение 5 минут
implicit:
  - Интерфейс сайта должен быть достаточно эстетичным
  - Вёрстка должна быть аддпативной - ровной и аккуратной при любых размерах окна
  - Все ресурсы сайта должны загрузаться корректно
  - Все запросы сайта должны отправляться корректно
  - В консоли Devtools не должно быть ошибок выполнения скриптов
  - Шрифт должен быть читаемым для большинства пользователей - достаточно большим и контрастным
  - Сайт должен реагировать на действия пользователя достаточно быстро - не дольше 1 секунды
  - Информация на сайте не должна нарушать законы об авторском праве
  - Сайт должен функционировать согласно законам страны, в которой он используется
  - Пользователь должен иметь возможность вернуться к заданным значениям фильтра после просмотра конкретного товара (задать фильтры - перейти в карточку товара - вернуться на страницу каталога - фильтры доджны сохранить введённый ранее значения)
 

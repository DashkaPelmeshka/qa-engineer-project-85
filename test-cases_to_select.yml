# Тест-кейсы к требованиям из файла requirements_final.yml
# Сайт соревновательного программирования — побеждает тот, кто быстрее решит задачу
# Формат каждого тест-кейса соответствует шаблону one_test-case.yaml

# =========================================================
# Тест-кейсы для блока functional
# =========================================================

- summary: |
    Отображение интерфейса на английском языке при первом открытии сайта
  requirement: |
    При первом открытии сайта игры интерфейс должен быть на английском
  prerequisites: Браузер с полностью очищенными cookies и кэшем, открыта главная страница сайта
  test-data: |
    Очищенные cookies и кэш браузера (имитация первого посещения сайта)
  steps:
    - Очистить cookies и кэш браузера
    - Открыть главную страницу сайта
    - Просмотреть все элементы интерфейса (меню, кнопки, подсказки, сообщения)
  expected-result: |
    Весь интерфейс сайта при первом открытии отображается на английском языке

- summary: |
    Наличие в списке выбора всех поддерживаемых языков программирования
  requirement: |
    На сайте пользователю должны быть доступны для выбора следующие языки программирования - C#, C++, Closure, D, Dart, Elixir, Go, Java, JavaScript, Kotlin, PHP, Python, Ruby, Rust, Swift, TypeScript, Zig
  prerequisites: Открыта страница создания битвы или страница начала игры с ботом с выбором языка программирования
  test-data: |
    Эталонный список из 17 языков - C#, C++, Closure, D, Dart, Elixir, Go, Java, JavaScript, Kotlin, PHP, Python, Ruby, Rust, Swift, TypeScript, Zig
  steps:
    - Открыть выпадающий список выбора языка программирования
    - Сравнить содержимое списка с эталонным списком языков
  expected-result: |
    В списке выбора присутствуют все 17 языков программирования - C#, C++, Closure, D, Dart, Elixir, Go, Java, JavaScript, Kotlin, PHP, Python, Ruby, Rust, Swift, TypeScript, Zig

- summary: |
    Выбор и изменение языка программирования на странице битвы
  requirement: |
    На странице битвы пользователь должен иметь возможность выбрать и в любой момент изменить язык программирования, на котором пользователь пишет решение задачи
  prerequisites: Открыта страница активной битвы с ботом
  test-data: |
    Первоначальный язык - Python, новый язык - JavaScript
  steps:
    - Начать битву с ботом, выбрав язык Python
    - Написать в редакторе часть решения на Python
    - Не завершая битву, открыть на странице битвы список выбора языка программирования
    - Выбрать язык JavaScript и продолжить написание решения
  expected-result: |
    Пользователь может выбрать язык программирования и изменить его в любой момент битвы; после смены подсветка синтаксиса и поведение редактора соответствуют новому языку

- summary: |
    Игра незарегистрированного пользователя в битву с ботом по случайной задаче
  requirement: |
    Незарегистрированный пользователь должен иметь возможность сыграть битву с соперником-ботом по случайной задаче, перед началом битвы выбрав язык программирования
  prerequisites: Открыта главная страница сайта, пользователь не зарегистрирован и не авторизован
  test-data: |
    Язык программирования - Python
  steps:
    - Не выполняя регистрацию и вход, нажать на главной странице кнопку игры с ботом
    - На экране выбора языка программирования выбрать Python
    - Подтвердить начало битвы
  expected-result: |
    Битва с соперником-ботом по случайной задаче начинается без требования регистрации, редактор кода настроен под выбранный язык программирования

- summary: |
    Успешная регистрация нового пользователя на сайте
  requirement: |
    Пользователь должен иметь возможность зарегистрироваться на сайте с помощью электронной почты, уникальной в пределах сайта, пароля (не менее 8 символов) и задаваемого пользователем ника (от 3 до 16 латинских букв, цифр и знаков "-" и "_"), уникального в пределах сайта
  prerequisites: Открыта страница регистрации
  test-data: |
    Email - newuser@example.com, пароль - Test1234, ник - new_user-1
  steps:
    - Ввести корректный адрес электронной почты
    - Ввести пароль длиной не менее 8 символов
    - Ввести ник от 3 до 16 символов из латинских букв, цифр и знаков "-" и "_"
    - Нажать кнопку регистрации
  expected-result: |
    Аккаунт успешно создан, пользователь видит сообщение о необходимости подтвердить электронную почту

- summary: |
    Подсветка ошибки при вводе ника с недопустимыми символами (негативный сценарий)
  requirement: |
    При регистрации на сайте сайт должен подсвечивать пользователю ошибку, если пользователь ввёл некорректный ник - с недопустимыми символами, слишком длинный или короткий, неуникальный в пределах сайта
  prerequisites: Открыта страница регистрации
  test-data: |
    Ники с недопустимыми символами - "юзер", "user name", "user!@$", "user+nick"
  steps:
    - Заполнить поля электронной почты и пароля корректными данными
    - Ввести в поле ника значение с недопустимыми символами (кириллица, пробел, спецсимволы)
    - Нажать кнопку регистрации
  expected-result: |
    Регистрация не выполняется, у поля ника подсвечивается ошибка с понятным сообщением о недопустимых символах

- summary: |
    Подсветка ошибки при вводе слишком длинного ника (негативный сценарий)
  requirement: |
    При регистрации на сайте сайт должен подсвечивать пользователю ошибку, если пользователь ввёл некорректный ник - с недопустимыми символами, слишком длинный или короткий, неуникальный в пределах сайта
  prerequisites: Открыта страница регистрации
  test-data: |
    Ник длиной 17 символов - "abcdefghijklmnopq"
  steps:
    - Заполнить поля электронной почты и пароля корректными данными
    - Ввести в поле ника значение длиной более 16 символов
    - Нажать кнопку регистрации
  expected-result: |
    Регистрация не выполняется, у поля ника подсвечивается ошибка с сообщением о слишком длинном нике

- summary: |
    Подсветка ошибки при вводе слишком короткого ника (негативный сценарий)
  requirement: |
    При регистрации на сайте сайт должен подсвечивать пользователю ошибку, если пользователь ввёл некорректный ник - с недопустимыми символами, слишком длинный или короткий, неуникальный в пределах сайта
  prerequisites: Открыта страница регистрации
  test-data: |
    Ник длиной 2 символа - "ab"
  steps:
    - Заполнить поля электронной почты и пароля корректными данными
    - Ввести в поле ника значение короче 3 символов
    - Нажать кнопку регистрации
  expected-result: |
    Регистрация не выполняется, у поля ника подсвечивается ошибка с сообщением о слишком коротком нике

- summary: |
    Подсветка ошибки при вводе неуникального ника (негативный сценарий)
  requirement: |
    При регистрации на сайте сайт должен подсвечивать пользователю ошибку, если пользователь ввёл некорректный ник - с недопустимыми символами, слишком длинный или короткий, неуникальный в пределах сайта
  prerequisites: Открыта страница регистрации, в системе существует пользователь с ником existing_user
  test-data: |
    Уже занятый ник - existing_user
  steps:
    - Заполнить поля электронной почты и пароля корректными данными
    - Ввести в поле ника уже занятый другим пользователем ник
    - Нажать кнопку регистрации
  expected-result: |
    Регистрация не выполняется, у поля ника подсвечивается ошибка с сообщением о неуникальном нике

- summary: |
    Подсветка ошибки при вводе слишком короткого пароля (негативный сценарий)
  requirement: |
    При регистрации на сайте сайт должен подсвечивать пользователю ошибку, если пользователь ввёл слишком короткий пароль
  prerequisites: Открыта страница регистрации
  test-data: |
    Пароль из 7 символов - "Test123"
  steps:
    - Заполнить поля электронной почты и ника корректными данными
    - Ввести в поле пароля значение длиной менее 8 символов
    - Нажать кнопку регистрации
  expected-result: |
    Регистрация не выполняется, у поля пароля подсвечивается ошибка с сообщением о слишком коротком пароле

- summary: |
    Подсветка ошибки при вводе некорректного адреса электронной почты (негативный сценарий)
  requirement: |
    При регистрации на сайте сайт должен подсвечивать пользователю ошибку, если пользователь ввёл некорректный адрес электронной почты
  prerequisites: Открыта страница регистрации
  test-data: |
    Некорректные адреса - "test@@mail.com", "testmail.com", "test@", "@mail.com"
  steps:
    - Заполнить поля ника и пароля корректными данными
    - Ввести в поле электронной почты некорректный адрес (без символа @, с двумя @, без домена)
    - Нажать кнопку регистрации
  expected-result: |
    Регистрация не выполняется, у поля электронной почты подсвечивается ошибка с сообщением о некорректном адресе

- summary: |
    Скрытие и показ символов вводимого пароля при регистрации
  requirement: |
    При регистрации на сайте пользователь должен иметь возможность скрыть или показать символы вводимого пароля
  prerequisites: Открыта страница регистрации
  test-data: |
    Пароль - Test1234
  steps:
    - Ввести в поле пароля произвольный пароль и убедиться, что символы маскируются
    - Нажать на иконку показа пароля (глаз)
    - Нажать на иконку повторно
  expected-result: |
    По умолчанию символы пароля скрыты (маскированы); после первого нажатия символы отображаются открыто, после повторного — снова скрываются

- summary: |
    Отправка письма с требованием подтвердить электронную почту при регистрации
  requirement: |
    При регистрации на сайте пользователя сайт должен отправить пользователю на почту сообщение с требованием подтвердить адрес электронной почты
  prerequisites: Открыта страница регистрации, доступен почтовый ящик тестового пользователя
  test-data: |
    Email - newuser@example.com, пароль - Test1234, ник - new_user-1
  steps:
    - Зарегистрироваться с корректными данными
    - Открыть почтовый ящик указанной при регистрации электронной почты
  expected-result: |
    На электронную почту пользователя приходит письмо от сайта с требованием подтвердить адрес электронной почты

- summary: |
    Подтверждение адреса электронной почты по ссылке из письма
  requirement: |
    При регистрации на сайте пользователь должен подтвердить адрес электронной почты, нажав на ссылку или кнопку подтверждения в письме, пришедшем на его электронный адрес
  prerequisites: Пользователь зарегистрирован, на его почту пришло письмо с подтверждением
  test-data: |
    Письмо подтверждения на почте newuser@example.com
  steps:
    - Открыть письмо с подтверждением электронной почты
    - Нажать на ссылку или кнопку подтверждения в письме
  expected-result: |
    Электронная почта подтверждается, аккаунт становится активным, пользователь видит сообщение об успешном подтверждении

- summary: |
    Уникальность ника каждого пользователя на сайте
  requirement: |
    Ник каждого пользователя на сайте должен быть уникальным
  prerequisites: Существует зарегистрированный пользователь с ником unique_user, открыта страница регистрации и выполнен вход вторым пользователем
  test-data: |
    Существующий ник - unique_user
  steps:
    - Попытаться зарегистрировать нового пользователя с ником unique_user
    - Авторизованному пользователю попытаться изменить свой ник на unique_user в личном кабинете
    - Просмотреть список пользователей и рейтинг
  expected-result: |
    Ни регистрация, ни смена ника на уже занятый ник не выполняются; на сайте нет двух пользователей с одинаковыми никами

- summary: |
    Уникальность электронной почты для аккаунтов на сайте
  requirement: |
    Для аккаунтов, созданных на сайте, указанная электронная почта должна быть уникальной
  prerequisites: Существует зарегистрированный пользователь с почтой first@example.com, открыта страница регистрации
  test-data: |
    Уже используемый email - first@example.com, новый ник - second_user
  steps:
    - Ввести в форме регистрации уже используемый адрес first@example.com
    - Заполнить остальные поля корректными данными (новый ник, корректный пароль)
    - Нажать кнопку регистрации
  expected-result: |
    Регистрация с уже используемым адресом электронной почты не выполняется, выводится ошибка о неуникальном email

- summary: |
    Вход на сайт с помощью аккаунта, созданного на сайте
  requirement: |
    Пользователь должен иметь возможность войти на сайт игры с помощью аккаунта, созданного на сайте, аккаунта GitHub или аккаунта Discord
  prerequisites: Открыта страница входа, существует подтверждённый аккаунт сайта
  test-data: |
    Email - newuser@example.com, пароль - Test1234
  steps:
    - Ввести email и пароль зарегистрированного аккаунта
    - Нажать кнопку входа
  expected-result: |
    Пользователь успешно входит на сайт под аккаунтом, созданным на сайте

- summary: |
    Вход на сайт с помощью аккаунта GitHub
  requirement: |
    Пользователь должен иметь возможность войти на сайт игры с помощью аккаунта, созданного на сайте, аккаунта GitHub или аккаунта Discord
  prerequisites: Открыта страница входа, существует аккаунт GitHub
  test-data: |
    Учётные данные существующего аккаунта GitHub
  steps:
    - На странице входа нажать кнопку входа через GitHub
    - Авторизоваться в GitHub во всплывающем окне
    - Подтвердить предоставление сайту доступа к данным аккаунта
  expected-result: |
    Пользователь успешно входит на сайт под аккаунтом GitHub

- summary: |
    Вход на сайт с помощью аккаунта Discord
  requirement: |
    Пользователь должен иметь возможность войти на сайт игры с помощью аккаунта, созданного на сайте, аккаунта GitHub или аккаунта Discord
  prerequisites: Открыта страница входа, существует аккаунт Discord
  test-data: |
    Учётные данные существующего аккаунта Discord
  steps:
    - На странице входа нажать кнопку входа через Discord
    - Авторизоваться в Discord во всплывающем окне
    - Подтвердить предоставление сайту доступа к данным аккаунта
  expected-result: |
    Пользователь успешно входит на сайт под аккаунтом Discord

- summary: |
    Восстановление забытого пароля через подтверждение по электронной почте
  requirement: |
    После регистрации на сайте пользователь должен иметь возможность восстановить забытый пароль через подтверждение по электронной почте, указанной при регистрации
  prerequisites: Открыта страница входа, существует аккаунт с подтверждённой почтой newuser@example.com
  test-data: |
    Email - newuser@example.com, новый пароль - NewTest5678
  steps:
    - На странице входа нажать ссылку восстановления пароля
    - Ввести email, указанный при регистрации
    - Открыть почтовый ящик и перейти по ссылке из письма восстановления
    - Задать новый пароль
    - Попытаться войти со старым паролем, затем с новым паролем
  expected-result: |
    Пароль успешно восстанавливается через подтверждение по почте; вход выполняется с новым паролем, старый пароль не работает

- summary: |
    Изменение ника в личном кабинете
  requirement: |
    Зарегистрированный пользователь должен иметь возможность изменить ник в личном кабинете
  prerequisites: Пользователь авторизован, открыт личный кабинет
  test-data: |
    Новый ник - renamed_user
  steps:
    - Открыть настройки профиля в личном кабинете
    - Ввести новый корректный ник
    - Сохранить изменения
  expected-result: |
    Ник изменён, новый ник отображается в профиле и во всех разделах сайта

- summary: |
    Выход из личного кабинета
  requirement: |
    Пользователь должен иметь возможность выйти из личного кабинета
  prerequisites: Пользователь авторизован, открыт личный кабинет
  test-data: |
    Не требуется
  steps:
    - Нажать кнопку выхода из личного кабинета
    - Обновить страницу и попытаться снова открыть страницу личного кабинета
  expected-result: |
    Пользователь разлогинен, страница личного кабинета недоступна, отображается форма входа

- summary: |
    Архивация аккаунта с обезличиванием профиля и завершением всех сеансов
  requirement: |
    Пользователь должен иметь возможность заархивировать аккаунт (обезличить профиль, завершить все сеансы и навсегда отключить доступ к этому аккаунту)
  prerequisites: Пользователь авторизован в двух браузерах (два активных сеанса), открыт личный кабинет
  test-data: |
    Данные аккаунта - email newuser@example.com, ник new_user-1
  steps:
    - Открыть настройки аккаунта в личном кабинете
    - Выбрать функцию архивации аккаунта
    - Подтвердить архивацию
    - Проверить страницу профиля во втором браузере (втором активном сеансе)
    - Попытаться войти в архивированный аккаунт с прежними данными
  expected-result: |
    Профиль обезличен, все сеансы завершены, вход в аккаунт навсегда отключён, персональные данные недоступны

- summary: |
    Задание уровня сложности задачи при создании битвы
  requirement: |
    При создании битвы пользователь должен иметь возможность задать уровень сложности задачи
  prerequisites: Пользователь авторизован, открыта форма создания битвы
  test-data: |
    Уровень сложности - easy (лёгкий)
  steps:

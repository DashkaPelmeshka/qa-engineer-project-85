- summary: |
    Проверка удобства использования и скорости работы сайта
  requirement: |
    Сайт нужно разработать с учетом удобства использования и оптимизировать для скорости работы
  prerequisites: Открыт сайт, доступен DevTools браузера
  test-data: |
    Не требуется
  steps:
    - Пройти ключевые сценарии без инструкций (регистрация, вход, создание битвы, участие в битве, просмотр рейтинга)
